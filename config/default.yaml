# Optional fixed id for reproducibility (otherwise auto: UTC timestamp + git short SHA)
# run_id: demo-2026-11-10

paths:
  raw_dir: data/raw
  clean_dir: data/clean
  labeled_dir: data/labeled
  artifacts_dir: artifacts

collector:
  seed_file: data/raw/sample_corpus.jsonl
  manifest_extra:
    project: small-llm-training-factory-demo
    license_hint: "synthetic_sample_only"

cleaner:
  min_chars: 20
  max_chars: 2000
  lowercase: true
  strip_extra_whitespace: true
  dedupe: true

labeling:
  instruction: "Summarize the following text in one sentence."
  output_key: "response"
  input_key: "instruction"
  # heuristic | llm  (llm uses OpenAI-compatible Chat Completions)
  mode: heuristic
  llm:
    api_key_env: OPENAI_API_KEY
    base_url_env: OPENAI_BASE_URL
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    temperature: 0.2
    max_tokens: 128
    timeout_sec: 60
    system_prompt: >
      You label training data for a small language model.
      Return only the one-sentence summary—no markdown or preamble.
  dpo:
    enabled: true
    # weak = first few words; tail = legacy tail-only summary (good rejected example)
    rejected_strategy: weak

training:
  dry_run: true
  base_model: "sshleifer/tiny-gpt2"
  output_dir: artifacts/checkpoints
  num_train_epochs: 1
  per_device_train_batch_size: 2
  learning_rate: 5.0e-5
  max_length: 128

evaluation:
  min_train_samples: 3
  gates:
    min_nonempty_rate: 1.0
    min_compression_ratio: 0.02
    max_compression_ratio: 0.95
    min_token_recall: 0.08
    max_token_f1: 0.92
    max_row_fail_fraction: 0.34

deployment:
  package_dir: artifacts/deploy
